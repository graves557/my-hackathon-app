<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bathroom Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-8">
        <div class="flex flex-col gap-4">
          <div>
            <p class="text-sm uppercase tracking-[0.3em] text-emerald-300">Bathroom Tracker</p>
            <h1 class="mt-2 text-3xl font-semibold text-white sm:text-4xl">Campus Bathroom Status</h1>
            <p class="mt-2 max-w-2xl text-slate-400">Select a building to view bathroom availability and usage status by floor.</p>
          </div>
          <nav class="flex flex-wrap gap-2" id="building-menu"></nav>
        </div>
      </header>

      <main class="space-y-6">
        <div class="rounded-3xl border border-slate-800 bg-slate-900/80 p-5 shadow-xl shadow-slate-950/20">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-lg font-semibold text-white">Bathrooms</h2>
              <p id="selected-building-label" class="mt-1 text-sm text-slate-400">Choose a building to see bathroom details.</p>
            </div>
            <div class="inline-flex items-center gap-2 rounded-full bg-slate-950/80 px-4 py-2 text-sm text-slate-300">
              <span class="h-3 w-3 rounded-full bg-emerald-400 shadow shadow-emerald-400/40"></span>
              Open
              <span class="h-3 w-3 rounded-full bg-red-500 shadow shadow-red-500/40 ml-4"></span>
              Closed
            </div>
          </div>
        </div>

        <div id="floor-sections" class="space-y-8"></div>
      </main>
    </div>

    <script>
      const statusUrl = '/api/status';
      const buildingMenu = document.getElementById('building-menu');
      const selectedBuildingLabel = document.getElementById('selected-building-label');
      const floorSections = document.getElementById('floor-sections');

      let dataset = [];
      let currentBuilding = null;

      function formatStatus(status) {
        const normalized = String(status || '').toLowerCase();
        if (normalized === 'open' || normalized === 'available') {
          return { label: 'Open', color: 'bg-emerald-500', ring: 'ring-emerald-500/40' };
        }
        return { label: 'Closed', color: 'bg-red-500', ring: 'ring-red-500/40' };
      }

      function createBuildingMenuItem(building) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'rounded-2xl border border-slate-800 bg-slate-950/80 px-4 py-2 text-sm font-semibold text-slate-300 transition hover:border-emerald-400 hover:bg-slate-900 hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/40';
        button.textContent = building.name;
        button.addEventListener('click', () => selectBuilding(building));
        return button;
      }

      function createBathroomCard(bathroom) {
        const status = formatStatus(bathroom.status);
        const card = document.createElement('div');
        card.className = 'rounded-2xl border border-slate-800 bg-slate-950/80 p-4 shadow-lg shadow-slate-950/20';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-base font-semibold text-white">${bathroom.name || bathroom.id}</p>
              <p class="mt-1 text-sm text-slate-400">ID: ${bathroom.id}</p>
            </div>
            <span class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-semibold text-slate-900 ${status.color} ${status.ring}">
              <span class="h-2.5 w-2.5 rounded-full ${status.color}"></span>
              ${status.label}
            </span>
          </div>
          <div class="mt-3 grid gap-1 text-sm text-slate-400">
            <p>Cleanliness: ${bathroom.cleanliness ?? 'Unknown'}</p>
            <p>Raw status: ${bathroom.status ?? 'Unknown'}</p>
          </div>
        `;
        return card;
      }

      function createFloorSection(floor, bathrooms) {
        const section = document.createElement('div');
        section.className = 'rounded-3xl border border-slate-800 bg-slate-900/80 p-6 shadow-xl shadow-slate-950/20';
        section.innerHTML = `
          <h3 class="text-lg font-semibold text-white mb-4">Floor ${floor}</h3>
          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
        `;
        const grid = section.querySelector('.grid');
        bathrooms.forEach((bathroom) => {
          grid.appendChild(createBathroomCard(bathroom));
        });
        return section;
      }

      function renderBuildingMenu() {
        buildingMenu.innerHTML = '';
        if (!dataset.length) {
          buildingMenu.innerHTML = '<p class="text-slate-500">No buildings available.</p>';
          return;
        }
        dataset.forEach((building) => {
          buildingMenu.appendChild(createBuildingMenuItem(building));
        });
      }

      function renderFloors(building) {
        floorSections.innerHTML = '';
        if (!building) {
          selectedBuildingLabel.textContent = 'Choose a building to see bathroom details.';
          return;
        }
        selectedBuildingLabel.textContent = `${building.bathrooms.length} bathroom${building.bathrooms.length === 1 ? '' : 's'} in ${building.name}`;

        // Group bathrooms by floor
        const floors = {};
        building.bathrooms.forEach((bathroom) => {
          const floor = bathroom.floor ?? 'Unknown';
          if (!floors[floor]) {
            floors[floor] = [];
          }
          floors[floor].push(bathroom);
        });

        // Sort floors numerically, with 'Unknown' at the end
        const sortedFloors = Object.keys(floors).sort((a, b) => {
          if (a === 'Unknown') return 1;
          if (b === 'Unknown') return -1;
          return parseInt(a) - parseInt(b);
        });

        sortedFloors.forEach((floor) => {
          floorSections.appendChild(createFloorSection(floor, floors[floor]));
        });
      }

      function selectBuilding(building) {
        currentBuilding = building;
        renderFloors(building);
        // Update menu button styles
        const buttons = buildingMenu.querySelectorAll('button');
        buttons.forEach((btn) => {
          if (btn.textContent === building.name) {
            btn.classList.add('border-emerald-400', 'bg-slate-900', 'text-white');
            btn.classList.remove('border-slate-800', 'bg-slate-950/80', 'text-slate-300');
          } else {
            btn.classList.remove('border-emerald-400', 'bg-slate-900', 'text-white');
            btn.classList.add('border-slate-800', 'bg-slate-950/80', 'text-slate-300');
          }
        });
      }

      async function loadStatus() {
        buildingMenu.innerHTML = '<p class="text-slate-400">Loading buildings...</p>';
        try {
          const response = await fetch(statusUrl);
          if (!response.ok) {
            throw new Error('Failed to fetch status');
          }
          const json = await response.json();
          dataset = json.buildings || [];
          renderBuildingMenu();
          if (!currentBuilding && dataset.length) {
            selectBuilding(dataset[0]);
          } else if (currentBuilding) {
            const matching = dataset.find((item) => item.name === currentBuilding.name);
            if (matching) {
              selectBuilding(matching);
            }
          }
        } catch (error) {
          buildingMenu.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-500/10 p-4 text-red-200">Unable to load building data. Try again later.</div>`;
          console.error(error);
        }
      }

      window.addEventListener('load', loadStatus);
    </script>
  </body>
</html>
